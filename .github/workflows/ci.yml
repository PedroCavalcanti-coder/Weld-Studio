name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      # LFS objects are not needed: the checks read the pointers stored in git.
      - uses: actions/checkout@v4
      - name: Meta files, LFS, forbidden folders
        run: python3 Tools/ci/check_repo.py

  domain-tests:
    name: Domain tests (.NET, no Unity)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run Core and Persistence tests against Unity stubs
        run: dotnet test Tools/ci/DomainTests --logger "console;verbosity=normal"
      - name: Compile editor-only code paths (UNITY_EDITOR)
        run: dotnet build Tools/ci/DomainTests -p:DefineConstants=UNITY_EDITOR -o "${RUNNER_TEMP}/editor-build"

  unity-tests:
    name: Unity EditMode/PlayMode tests
    runs-on: ubuntu-latest
    needs: [hygiene, domain-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Skips cleanly until the Unity project exists (Phase 0) and the license secrets are configured.
      - name: Check prerequisites
        id: prerequisites
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "::notice::Unity project not created yet (docs/06-setup.md); skipping Unity tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::UNITY_LICENSE secret is not configured; skipping Unity tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Library
        if: steps.prerequisites.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run tests
        if: steps.prerequisites.outputs.run == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results
        if: always() && steps.prerequisites.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts
